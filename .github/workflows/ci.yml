name: MarketPulse CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketpulse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-and-ml:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install ML dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Compile Java backend
        run: |
          mkdir -p backend/classes
          javac --release 21 -d backend/classes backend/*.java
      - name: Validate frontend JavaScript
        run: for f in frontend/*.js; do node --check "$f"; done
      - name: ML training and held-out evaluation (synthetic fixtures only)
        run: python tests/check_ml.py
      - name: Long-history daily equity ML checks (synthetic fixtures; no broker secrets)
        run: python tests/check_long_history.py
      - name: Private Upstox bootstrap mock security checks
        run: python tests/check_live_bootstrap.py
      - name: Full provider-shaped collection and ML training fixture (never genuine credentials)
        run: python tests/check_live_training_fixture.py
      - name: Verify private Upstox training launcher and ML inference data provenance
        run: python tests/check_private_live_ml.py
      - name: Confirmed-candle BUY/SELL/EXIT signal and no-repaint checks
        run: node tests/check_momentum_signals.cjs
      - name: Guard local Upstox credential and demo-mode launcher behavior
        run: python tests/check_upstox_mode.py
      - name: Offline API, Copilot, search and Upstox adapter regression suite
        run: bash tests/ci_smoke.sh
      - name: Full NSE/BSE equity catalogues and page-scoped market quote tests
        run: python tests/check_india_heatmap.py

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Compile Java and start synthetic test server
        run: |
          mkdir -p backend/classes
          javac --release 21 -d backend/classes backend/*.java
          PORT=8876 java -cp backend/classes MarketPulseServer > /tmp/marketpulse-browser.log 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:8876/api/health && break; sleep .4; done
      - name: Test UI navigation, chart, drawings, heatmap, news, and mobile
        run: python tests/check_v8_browser.py 8876
      - name: Test chart-first workspace and historical signal annotations
        run: python tests/check_chart_pro.py 8876
      - name: Test full NSE/BSE heatmap tabs, search, navigation and stock opening
        run: python tests/check_india_heatmap.py --browser
      - name: Upload browser screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: marketpulse-browser-debug
          path: preview_v8_*.png
          if-no-files-found: ignore

  public-deployment:
    needs: [api-and-ml, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify hosted Render URL serves V9 demo safely
        env:
          PUBLIC_SITE_URL: https://marketpulse-hackathon.onrender.com
          CLOUD_CHECK_ATTEMPTS: '8'
        run: python tests/check_cloud_deploy.py

  windows-launchers:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse all PowerShell launch scripts without executing or requesting tokens
        shell: pwsh
        run: |
          $failed = @()
          foreach ($file in Get-ChildItem -Path . -Filter '*.ps1') {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $failed += $file.Name
              Write-Host "PowerShell parse FAILED for $($file.Name)"
            } else { Write-Host "PASS: $($file.Name)" }
          }
          if ($failed.Count -gt 0) { throw "Invalid PowerShell launcher syntax" }
